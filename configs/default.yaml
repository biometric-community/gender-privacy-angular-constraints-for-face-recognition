paper:
  slug: gender-privacy-angular-constraints-for-face-recognition
  title: "Gender Privacy: Angular Constraints for Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  embed_dim: 512
  private_dim: 512
  pretrained_backbone: true
  arcface_s: 64.0
  arcface_m: 0.0
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 128
  backbone_epochs: 8
  privacy_epochs: 40
  optimizer: sgd
  lr_backbone: 0.1
  lr_privacy: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  alpha: 20.0
  beta: 1.0
eval:
  batch_size: 128
  max_lfw_pairs: null
  gender_probe_max: 8000
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
